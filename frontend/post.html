<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 🔴 Dynamic SEO Meta Tags -->
    <title id="dynamic-title"></title>
    <meta id="dynamic-meta-desc" name="description" content="Learn actionable search engine optimization strategies to rank your website on top of search results in 2026. Step-by-step master guide for beginners.">
    <meta id="dynamic-keywords" name="keywords" content="SEO Guide 2026, Search Engine Optimization, On-Page SEO, Digital Marketing">
    
    <link rel="icon" type="image/x-icon" href="./static/favicon.ico">
    <!-- 🟢 Canonical URL Tag -->
    <link id="dynamic-canonical" rel="canonical" href="" />

    <!-- 🟢 Publisher & Author Tags -->
    <meta id="dynamic-publisher" name="publisher" content="Alora Radiance">
    <meta id="dynamic-author" name="author" content="Alora Radiance">

    <!-- 🟢 Robots Tag (Indexable) -->
    <meta name="robots" content="index, follow">
    
    <!-- Open Graph (Social Previews) -->
    <meta id="og-title" property="og:title" content="">
    <meta id="og-desc" property="og:description" content="">
    <meta id="og-image" property="og:image" content="">
    <meta id="og-url" property="og:url" content="">
    
    <!-- JSON-LD Schema Placeholder -->
    <script id="dynamic-json-ld" type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "headline": "Alora Radiance Skincare Article",
      "description": "Learn actionable skincare strategies for healthy, glowing skin with Alora Radiance.",
      "publisher": {
        "@type": "Organization",
        "name": "Alora Radiance"
      }
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 🔴 Essential Custom Colors & Fonts Config for Layout & Footer -->
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    ink: '#152219',
                    'ink-light': '#1F3327',
                    'ink-soft': '#28402F',
                    parchment: '#F7F2E7',
                    card: '#FFFFFF',
                    clay: '#A24C3D',
                    'clay-light': '#C97E63',
                    'clay-dark': '#7E3A2F',
                    sage: '#6C8763',
                    'sage-light': '#E7ECDF',
                    gold: '#BB9556',
                    ash: '#6B685F',
                },
                fontFamily: {
                    sans: ['"PT Sans"', 'Manrope', 'sans-serif'],
                    fraunces: ['Fraunces', 'serif'],
                    roboto: ['"Roboto Mono"', 'monospace'],
                },
            }
        }
    }
    </script>

    <style>
        /* Professional Blog Typography & Content Spacing Rules */
        .post-body-content {
            font-size: 1.0625rem; /* 17px reading size */
            line-height: 1.8;
            color: #2D3748;
        }

        .post-body-content p {
            margin-bottom: 1.15rem;
            color: #374151;
        }

        /* Automatically collapse empty Quill paragraphs and breaks */
        .post-body-content p:empty,
        .post-body-content p:has(> br:only-child) {
            display: none !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        .post-body-content h2 {
            font-size: 1.625rem; /* 26px */
            font-weight: 700;
            color: #152219;
            margin-top: 2rem;
            margin-bottom: 0.875rem;
            line-height: 1.35;
            letter-spacing: -0.01em;
            padding-bottom: 0.35rem;
            border-bottom: 1px solid rgba(139, 69, 19, 0.12);
        }

        .post-body-content h3 {
            font-size: 1.35rem; /* 21px */
            font-weight: 600;
            color: #1F3327;
            margin-top: 1.75rem;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }

        .post-body-content h4 {
            font-size: 1.15rem;
            font-weight: 600;
            color: #4A5568;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .post-body-content ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-top: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .post-body-content ol {
            list-style-type: decimal;
            padding-left: 1.5rem;
            margin-top: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .post-body-content li {
            margin-bottom: 0.5rem;
            color: #374151;
        }

        .post-body-content blockquote {
            border-left: 4px solid #8B4513;
            background-color: rgba(139, 69, 19, 0.04);
            padding: 1rem 1.25rem;
            margin: 1.5rem 0;
            border-radius: 0 12px 12px 0;
            font-style: italic;
            color: #4A5568;
        }

        .post-body-content img {
            max-width: 100%;
            max-height: 520px;
            height: auto;
            border-radius: 16px;
            margin: 1.75rem auto;
            display: block;
            object-fit: cover;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        }

        .post-body-content a {
            color: #8B4513;
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.2s;
        }

        .post-body-content a:hover {
            color: #70360D;
        }

        .post-body-content strong, .post-body-content b {
            color: #152219;
            font-weight: 700;
        }

        /* 📊 Ultra-Clean Luxury Responsive Table Styling */
        .post-body-content table {
            width: 100% !important;
            margin: 2rem 0 !important;
            border-collapse: collapse !important;
            display: table !important;
            border-radius: 14px !important;
            overflow: hidden !important;
            box-shadow: 0 4px 15px -2px rgba(21, 34, 25, 0.06), 0 0 0 1px rgba(21, 34, 25, 0.12) !important;
            background-color: #FFFFFF !important;
        }

        .post-body-content thead {
            background-color: #152219 !important;
            color: #FFFFFF !important;
        }

        .post-body-content th {
            padding: 0.95rem 1.25rem !important;
            font-weight: 700 !important;
            font-size: 0.9375rem !important;
            color: #FFFFFF !important;
            text-align: left !important;
            border-bottom: 2px solid #8B4513 !important;
            background-color: #152219 !important;
            letter-spacing: 0.02em !important;
        }

        .post-body-content td {
            padding: 0.85rem 1.25rem !important;
            font-size: 0.9375rem !important;
            color: #2D3748 !important;
            border-bottom: 1px solid rgba(21, 34, 25, 0.1) !important;
            border-right: 1px solid rgba(21, 34, 25, 0.06) !important;
            line-height: 1.6 !important;
            vertical-align: top !important;
        }

        .post-body-content tr td:last-child,
        .post-body-content tr th:last-child {
            border-right: none !important;
        }

        .post-body-content tr:last-child td {
            border-bottom: none !important;
        }

        .post-body-content tr:nth-child(even) td {
            background-color: #FBF9F4 !important;
        }

        .post-body-content tr:hover td {
            background-color: #F4EFE6 !important;
        }
    </style>
</head>
<body class="bg-[#FAF7F2] font-sans text-ink min-h-screen flex flex-col justify-between">

    <!-- Header Section -->
    <header class="w-full">
        <div id="navbar-placeholder"></div>
    </header>

    <!-- Main Content Section -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 md:py-12">
        <!-- Back Button -->
        <a href="./Blog.html" class="inline-flex items-center gap-2 text-[#8B4513] font-semibold mb-6 hover:text-amber-900 transition-colors text-sm">
            <i class="fa-solid fa-arrow-left text-xs"></i> Back to All Blogs
        </a>

        <!-- Blog Content Container Card -->
        <article id="blog-content-area" class="hidden bg-white rounded-3xl p-6 sm:p-10 md:p-14 shadow-sm border border-amber-900/10">
            <div class="mb-8 border-b border-amber-900/10 pb-6">
                <div class="flex items-center space-x-3 text-xs tracking-wide mb-4">
                    <span id="post-category" class="bg-amber-100/70 text-[#8B4513] px-3 py-1 rounded-full text-[11px] font-bold uppercase font-roboto border border-amber-300/40"></span>
                    <span class="text-slate-300">•</span>
                    <span id="post-date" class="text-slate-500 font-medium"></span>
                </div>
                <h1 id="post-title" class="text-2xl sm:text-4xl md:text-5xl font-fraunces font-bold text-ink leading-tight sm:leading-snug text-slate-900"></h1>
            </div>

            <!-- Cover Image -->
            <div class="w-full aspect-[16/9] rounded-2xl overflow-hidden shadow-md mb-8 bg-slate-100 border border-amber-900/10">
                <img id="post-cover" src="" alt="" class="w-full h-full object-cover">
            </div>

            <!-- Content Body -->
            <div id="post-body" class="post-body-content text-slate-800">
            </div>
        </article>

        <!-- Loader -->
        <div id="post-loader" class="text-center py-24 text-ash">
            <i class="fa-solid fa-spinner fa-spin text-3xl mb-3 text-[#8B4513]"></i>
            <p class="text-slate-600 text-sm">Fetching article details...</p>
        </div>
    </main>

    <!-- Footer Container -->
    <footer class="w-full mt-auto">
        <div id="footer-placeholder"></div>
    </footer>

    <script src="/js/include.js"></script>
    <script type="module" src="/js/post-detail.js"></script>
    
</body>
</html>
