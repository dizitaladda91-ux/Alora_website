<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO ALORA | Products</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="font-['Manrope'] bg-gray-50 min-h-screen">
    <nav class="h-16 bg-gray-900 text-white flex items-center px-6"><h1 class="text-xl font-bold text-indigo-400">SEO ALORA <span class="text-white text-sm font-normal ml-2">| Product Content</span></h1></nav>
    <main class="max-w-6xl mx-auto p-6 sm:p-8">
        <div class="flex items-start justify-between gap-4 mb-6 border-b border-gray-200 pb-5">
            <div><h2 class="text-3xl font-bold text-gray-900">Listed Products</h2><p class="mt-1 text-sm text-gray-500">You can update product image, description, rating and ML/volume only.</p></div>
            <a href="./seoadmin.html" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800 whitespace-nowrap"><i class="fa-solid fa-arrow-left mr-1"></i> Dashboard</a>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-x-auto">
            <table class="w-full text-left"><thead class="bg-gray-50 border-b text-xs uppercase tracking-wider text-gray-500"><tr><th class="px-6 py-4">Product</th><th class="px-6 py-4">Description</th><th class="px-6 py-4">Rating</th><th class="px-6 py-4">Measurements</th><th class="px-6 py-4 text-right">Action</th></tr></thead>
            <tbody id="seo-product-table" class="divide-y divide-gray-200 text-sm"><tr><td colspan="5" class="px-6 py-10 text-center text-gray-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Loading products...</td></tr></tbody></table>
        </div>
    </main>
    <script type="module" src="./js/auth.js"></script><script type="module" src="./js/seoproduct.js"></script>
</body>
</html>
