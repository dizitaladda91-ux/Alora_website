<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affiliate Dashboard | Alora Radiance</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#FCF8EF] text-[#2A2A24]">
  <main class="max-w-6xl mx-auto p-5 md:p-10">
    <div class="flex items-center justify-between gap-4"><div><p class="text-[#A0522D] text-sm font-semibold">ALORA AFFILIATE</p><h1 class="text-3xl font-serif font-semibold">Your dashboard</h1></div><button id="affiliateLogout" class="border rounded-lg px-4 py-2 text-sm">Sign out</button></div>
    <p id="affiliateError" class="mt-6 text-red-700" aria-live="polite"></p>
    <section id="affiliateDashboard" class="hidden">
      <div class="mt-7 bg-white rounded-2xl border border-[#E9DFC8] p-5"><p class="text-sm text-stone-500">Your referral link</p><div class="mt-2 flex flex-col sm:flex-row gap-2"><input id="affiliateLink" readonly class="flex-1 border rounded-lg p-3 text-sm"><button id="copyAffiliateLink" class="rounded-lg bg-[#A0522D] text-white px-4 py-3 text-sm font-semibold">Copy link</button></div><p id="affiliateCode" class="mt-3 text-sm text-stone-600"></p></div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-5"><div class="bg-white rounded-2xl p-5 border"><p class="text-sm text-stone-500">Clicks</p><p id="affiliateClicks" class="text-3xl font-semibold mt-2">0</p></div><div class="bg-white rounded-2xl p-5 border"><p class="text-sm text-stone-500">Conversions</p><p id="affiliateConversions" class="text-3xl font-semibold mt-2">0</p></div><div class="bg-white rounded-2xl p-5 border"><p class="text-sm text-stone-500">Pending commission</p><p id="affiliatePending" class="text-3xl font-semibold mt-2">₹0.00</p></div></div>
      <section class="mt-7 bg-white rounded-2xl border overflow-hidden"><div class="p-5 border-b"><h2 class="font-semibold">Conversions</h2></div><div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-stone-50 text-left"><tr><th class="p-3">Date</th><th class="p-3">Order</th><th class="p-3">Order amount</th><th class="p-3">Commission</th><th class="p-3">Status</th></tr></thead><tbody id="affiliateConversionsTable"></tbody></table></div></section>
    </section>
  </main>
  <script type="module" src="./js/affiliate.js"></script>
</body>
</html>
