<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alora Radiance - Shop</title>
    <link rel="icon" type="image/x-icon" href="./static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/tailwind.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            background-color: #FAF7F2 !important;
            color: #152219;
            margin: 0;
            padding: 0;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        img {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: high-quality;
        }
        @keyframes youtubeShimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton-shimmer {
            background: linear-gradient(90deg, #ede8dd 0%, #f7f4ed 50%, #ede8dd 100%);
            background-size: 200% 100%;
            animation: youtubeShimmer 1.6s infinite ease-in-out;
        }
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: cardFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-parchment text-[#2A2A24] font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- NAV Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- SUB-BAR -->
    <div class="bg-gradient-to-r from-[#FBF8F3] via-white to-[#FBF8F3] border-b border-[#ECE4CE] shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div>
                <span class="text-[10px] font-extrabold tracking-[0.25em] uppercase text-[#8B4513] font-mono">The Skincare Collection</span>
                <h1 class="text-lg font-fraunces font-bold text-slate-900 leading-tight">Shop All Formulations</h1>
            </div>
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar w-full sm:w-auto pb-1 sm:pb-0">
                <button onclick="applyQuickFilter('all', event)" class="quick-filter-btn text-xs font-extrabold uppercase tracking-wider text-slate-700 hover:text-slate-900 bg-white hover:bg-amber-50 px-3.5 py-1.5 rounded-full border border-amber-900/15 shadow-xs transition shrink-0">View All</button>
                <button onclick="applyQuickFilter('bestseller', event)" class="quick-filter-btn text-xs font-extrabold uppercase tracking-wider text-amber-800 hover:text-amber-900 bg-amber-100/70 hover:bg-amber-100 px-3.5 py-1.5 rounded-full border border-amber-300 shadow-xs transition shrink-0 flex items-center gap-1.5">
                    <i class="fa-solid fa-fire text-amber-600 text-xs"></i> Bestsellers
                </button>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-8 flex-grow">

        <!-- Mobile Filter Toggle Bar -->
        <div class="lg:hidden flex items-center justify-between mb-4 bg-white border border-amber-900/15 p-3.5 rounded-2xl shadow-sm">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-900 flex items-center gap-2 font-fraunces">
                <i class="fa-solid fa-sliders text-[#8B4513]"></i> Filter &amp; Sort
            </span>
            <button id="toggle-filter-btn" type="button" class="bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-slate-950 text-xs font-extrabold px-3.5 py-2 rounded-xl flex items-center gap-1.5 shadow-sm transition active:scale-95">
                <i class="fa-solid fa-filter text-xs"></i> <span>Filter Options</span>
            </button>
        </div>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Sidebar Filters (Slide-up drawer on mobile, sticky sidebar on desktop) -->
            <aside id="filter-sidebar" class="fixed inset-x-0 bottom-0 z-50 rounded-t-3xl max-h-[85vh] overflow-y-auto bg-gradient-to-b from-[#FFFDF9] via-white to-[#FFFDF9] p-6 shadow-2xl border-t border-amber-900/20 translate-y-full transition-transform duration-300 ease-out hidden lg:block lg:static lg:z-auto lg:rounded-3xl lg:max-h-none lg:overflow-visible lg:border lg:translate-y-0 lg:w-64 lg:flex-shrink-0 lg:shadow-xl lg:h-fit lg:p-6 relative">
                <!-- YouTube Shimmer Skeleton for Filters -->
                <div id="filter-skeleton" class="space-y-6">
                    <div class="flex justify-between items-center pb-4 border-b border-dashed border-[#E3D9BC]">
                        <div class="skeleton-shimmer h-5 w-24 rounded"></div>
                        <div class="skeleton-shimmer h-4 w-12 rounded"></div>
                    </div>
                    <div>
                        <div class="skeleton-shimmer h-3 w-16 rounded mb-2.5"></div>
                        <div class="skeleton-shimmer h-9 w-full rounded-lg"></div>
                    </div>
                    <div>
                        <div class="skeleton-shimmer h-3 w-20 rounded mb-2.5"></div>
                        <div class="space-y-2.5">
                            <div class="skeleton-shimmer h-4 w-28 rounded"></div>
                            <div class="skeleton-shimmer h-4 w-28 rounded"></div>
                        </div>
                    </div>
                    <div>
                        <div class="skeleton-shimmer h-3 w-20 rounded mb-2.5"></div>
                        <div class="skeleton-shimmer h-2 w-full rounded mb-2"></div>
                        <div class="flex justify-between">
                            <div class="skeleton-shimmer h-3 w-8 rounded"></div>
                            <div class="skeleton-shimmer h-3 w-12 rounded"></div>
                        </div>
                    </div>
                    <div>
                        <div class="skeleton-shimmer h-3 w-28 rounded mb-2.5"></div>
                        <div class="space-y-2">
                            <div class="skeleton-shimmer h-4 w-36 rounded"></div>
                            <div class="skeleton-shimmer h-4 w-36 rounded"></div>
                        </div>
                    </div>
                </div>

                <!-- Actual Filter Content (Fades in smoothly when ready) -->
                <div id="filter-content" class="hidden space-y-6">
                    
                    <div class="flex items-center justify-between border-b border-amber-900/10 pb-3.5">
                        <h2 class="font-fraunces font-bold text-slate-900 tracking-wide text-base flex items-center gap-2">
                            <i class="fa-solid fa-sliders text-[#8B4513] text-sm"></i> Filter Suite
                        </h2>
                        <div class="flex items-center gap-2">
                            <button onclick="resetFilters()" class="text-[11px] font-extrabold text-[#8B4513] bg-amber-100/70 hover:bg-[#8B4513] hover:text-white px-2.5 py-1 rounded-full transition shadow-xs">
                                Clear All
                            </button>
                            <button id="close-filter-btn" type="button" class="lg:hidden text-slate-500 hover:text-slate-900 text-xl font-bold p-1">
                                &times;
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-extrabold text-slate-700 uppercase tracking-widest mb-2 font-mono">Sort By Price &amp; Rating</label>
                        <select id="sort-filter" onchange="filterProducts()" class="w-full bg-[#FDFBF7] border border-amber-900/20 rounded-xl p-3 text-xs font-semibold text-slate-800 focus:ring-2 focus:ring-amber-500/40 outline-none shadow-xs transition">
                            <option value="featured">✨ Featured Selection</option>
                            <option value="price-low-high">💵 Price: Low to High</option>
                            <option value="price-high-low">💎 Price: High to Low</option>
                            <option value="rating-high-low">★ Top Rated First</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[11px] font-extrabold text-slate-700 uppercase tracking-widest mb-2 font-mono">Category Collections</label>
                        <div class="space-y-2">
                            <label class="flex items-center p-2.5 rounded-xl border border-amber-900/10 hover:border-amber-400 bg-white hover:bg-amber-50/40 transition cursor-pointer text-xs font-bold text-slate-800">
                                <input type="checkbox" name="category" value="face" onchange="filterProducts()" class="rounded border-slate-300 text-[#8B4513] focus:ring-amber-500 mr-3 w-4 h-4">
                                <i class="fa-solid fa-sparkles text-amber-600 mr-2 text-xs"></i> Face Skincare
                            </label>
                            <label class="flex items-center p-2.5 rounded-xl border border-amber-900/10 hover:border-amber-400 bg-white hover:bg-amber-50/40 transition cursor-pointer text-xs font-bold text-slate-800">
                                <input type="checkbox" name="category" value="body" onchange="filterProducts()" class="rounded border-slate-300 text-emerald-700 focus:ring-emerald-500 mr-3 w-4 h-4">
                                <i class="fa-solid fa-droplet text-emerald-600 mr-2 text-xs"></i> Bodycare Rituals
                            </label>
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-[11px] font-extrabold text-slate-700 uppercase tracking-widest font-mono">Maximum Price</label>
                            <span id="price-max-label" class="text-xs font-extrabold text-[#8B4513] bg-amber-100 px-2 py-0.5 rounded-md border border-amber-300 font-mono">₹2500</span>
                        </div>
                        <input type="range" id="price-range" min="200" max="2500" value="2500" oninput="updatePriceLabel(this.value)" onchange="filterProducts()" class="w-full h-2 bg-amber-200/60 rounded-lg appearance-none cursor-pointer accent-[#8B4513]">
                        <div class="flex justify-between text-[10px] font-mono text-slate-500 mt-1">
                            <span>₹200</span>
                            <span>₹2,500</span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-extrabold text-slate-700 uppercase tracking-widest mb-2 font-mono">Customer Reviews</label>
                        <div class="space-y-2">
                            <button onclick="setRatingFilter(4)" class="rating-filter-btn w-full flex items-center justify-between p-2.5 rounded-xl border border-amber-900/10 hover:border-amber-400 bg-white hover:bg-amber-50/40 transition text-xs font-bold text-slate-800 text-left">
                                <span class="flex items-center text-amber-500 text-xs gap-1">
                                    <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-regular fa-star text-slate-300"></i>
                                    <span class="text-slate-700 font-semibold ml-1">&amp; Up</span>
                                </span>
                                <span class="text-[10px] text-slate-400 font-mono">4.0+</span>
                            </button>
                            <button onclick="setRatingFilter(3)" class="rating-filter-btn w-full flex items-center justify-between p-2.5 rounded-xl border border-amber-900/10 hover:border-amber-400 bg-white hover:bg-amber-50/40 transition text-xs font-bold text-slate-800 text-left">
                                <span class="flex items-center text-amber-500 text-xs gap-1">
                                    <i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-regular fa-star text-slate-300"></i><i class="fa-regular fa-star text-slate-300"></i>
                                    <span class="text-slate-700 font-semibold ml-1">&amp; Up</span>
                                </span>
                                <span class="text-[10px] text-slate-400 font-mono">3.0+</span>
                            </button>
                        </div>
                    </div>

                </div>
            </aside>

            <!-- Product Grid Area (First on mobile via order-1) -->
            <section class="flex-1 order-1 lg:order-2">
                <div class="flex items-center justify-between mb-6 bg-white border border-[#ECE4CE] p-4 rounded-2xl shadow-sm">
                    <span id="results-count" class="text-sm font-medium text-ash">Showing all products</span>
                    <div class="flex gap-2 text-xs">
                        <span id="badge-bestseller" class="hidden bg-clay/10 text-clay-dark font-semibold px-3 py-1.5 rounded-full"><i class="fa-solid fa-fire mr-1"></i>Bestseller Filter Active</span>
                    </div>
                </div>

                <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 gap-3 sm:gap-6">
                    <!-- YouTube-Style Shimmer Skeleton Loader 1 -->
                    <div class="bg-white rounded-2xl p-4 border border-[#ECE4CE] h-[470px] flex flex-col justify-between shadow-sm overflow-hidden">
                        <div class="skeleton-shimmer h-[170px] rounded-xl mb-4 w-full"></div>
                        <div class="skeleton-shimmer h-4 rounded w-3/4 mx-auto mb-2"></div>
                        <div class="skeleton-shimmer h-3 rounded w-5/6 mx-auto mb-4"></div>
                        <div class="flex justify-between items-center px-2 mb-3">
                            <div class="skeleton-shimmer h-6 w-16 rounded-full"></div>
                            <div class="skeleton-shimmer h-6 w-16 rounded-md"></div>
                        </div>
                        <div class="skeleton-shimmer h-8 rounded-lg w-full mb-3"></div>
                        <div class="skeleton-shimmer h-10 rounded-xl w-full mt-auto"></div>
                    </div>
                    <!-- YouTube-Style Shimmer Skeleton Loader 2 -->
                    <div class="bg-white rounded-2xl p-4 border border-[#ECE4CE] h-[470px] flex flex-col justify-between shadow-sm overflow-hidden hidden sm:flex">
                        <div class="skeleton-shimmer h-[170px] rounded-xl mb-4 w-full"></div>
                        <div class="skeleton-shimmer h-4 rounded w-3/4 mx-auto mb-2"></div>
                        <div class="skeleton-shimmer h-3 rounded w-5/6 mx-auto mb-4"></div>
                        <div class="flex justify-between items-center px-2 mb-3">
                            <div class="skeleton-shimmer h-6 w-16 rounded-full"></div>
                            <div class="skeleton-shimmer h-6 w-16 rounded-md"></div>
                        </div>
                        <div class="skeleton-shimmer h-8 rounded-lg w-full mb-3"></div>
                        <div class="skeleton-shimmer h-10 rounded-xl w-full mt-auto"></div>
                    </div>
                    <!-- YouTube-Style Shimmer Skeleton Loader 3 -->
                    <div class="bg-white rounded-2xl p-4 border border-[#ECE4CE] h-[470px] flex flex-col justify-between shadow-sm overflow-hidden hidden md:flex">
                        <div class="skeleton-shimmer h-[170px] rounded-xl mb-4 w-full"></div>
                        <div class="skeleton-shimmer h-4 rounded w-3/4 mx-auto mb-2"></div>
                        <div class="skeleton-shimmer h-3 rounded w-5/6 mx-auto mb-4"></div>
                        <div class="flex justify-between items-center px-2 mb-3">
                            <div class="skeleton-shimmer h-6 w-16 rounded-full"></div>
                            <div class="skeleton-shimmer h-6 w-16 rounded-md"></div>
                        </div>
                        <div class="skeleton-shimmer h-8 rounded-lg w-full mb-3"></div>
                        <div class="skeleton-shimmer h-10 rounded-xl w-full mt-auto"></div>
                    </div>
                </div>

                <div id="no-products" class="hidden text-center py-20 bg-white border border-[#ECE4CE] rounded-2xl mt-4">
                    <i class="fa-solid fa-magnifying-glass text-4xl text-[#D9D2BC] mb-3"></i>
                    <p class="text-ash font-medium">No items matched your filter selection.</p>
                </div>
            </section>
        </div>
    </main>

    <!-- FOOTER & MODALS -->
    <div id="footer-placeholder"></div>
    <div id="lead-modal-container"></div>

    <!-- CLEANED SCRIPTS (No Duplicate Imports) -->
    <script src="./js/alora-storefront-discount.js" async defer></script>
    <script src="./js/include.js"></script>
    <script type="module" src="./js/navbar-interactions.js"></script>
    <script type="module" src="./js/lead.js"></script>
    <script type="module" src="./js/moreproduct.js"></script>

    <script>
        fetch('/lead.html')
            .then(response => response.text())
            .then(htmlContent => {
                document.getElementById('lead-modal-container').innerHTML = htmlContent;
            })
            .catch(err => console.error("Could not load lead modal:", err));
    </script>
</body>
</html>
