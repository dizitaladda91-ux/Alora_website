<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alora Radiance - Shop</title>
    <link rel="icon" type="image/x-icon" href="./static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    ink: '#152219',
                    'ink-light': '#1F3327',
                    'ink-soft': '#28402F',
                    parchment: '#F7F2E7',
                    card: '#FFFFFF',
                    clay: '#A24C3D',
                    'clay-light': '#C97E63',
                    'clay-dark': '#7E3A2F',
                    sage: '#6C8763',
                    'sage-light': '#E7ECDF',
                    gold: '#BB9556',
                    ash: '#6B685F',
                },
                fontFamily: {
                    robot: ['"PT Sans"', 'ui-robot', 'Georgia', 'robot'],
                    sans: ['"PT Sans"', 'Manrope', 'sans-serif'],
                    roboto: ['"Roboto Mono"', 'monospace'],
                },
            }
        }
    }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes youtubeShimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton-shimmer {
            background: linear-gradient(90deg, #ede8dd 0%, #f7f4ed 50%, #ede8dd 100%);
            background-size: 200% 100%;
            animation: youtubeShimmer 1.6s infinite ease-in-out;
        }
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: cardFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
    <script
  src="https://aloraaffilation.onrender.com/alora-storefront-discount.js"
  defer>
</script>
</head>
<body class="bg-parchment text-[#2A2A24] font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- NAV Placeholder -->
    <div id="navbar-placeholder"></div>

    <!-- SUB-BAR -->
    <div class="bg-white border-b border-[#ECE4CE]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
            <div>
                <p class="text-[10px] font-bold tracking-[0.25em] uppercase text-clay">The Collection</p>
                <h1 class="text-sm font-serif font-semibold text-ink -mt-0.5">Shop All Products</h1>
            </div>
          <div class="flex items-center gap-2">
    <button onclick="applyQuickFilter('all', event)" class="text-xs font-semibold uppercase tracking-wide text-ash hover:text-ink px-3 py-1.5 rounded-full border border-transparent hover:border-[#E3D9BC] transition">View All</button>
    <button onclick="applyQuickFilter('bestseller', event)" class="text-xs font-semibold uppercase tracking-wide text-ash hover:text-clay px-3 py-1.5 rounded-full border border-transparent hover:border-clay/30 transition">
        <i class="fa-solid fa-fire text-clay mr-1"></i>Bestsellers
    </button>
</div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow">
        <!-- Mobile Filter Toggle Bar -->
        <div class="lg:hidden flex items-center justify-between mb-4 bg-white border border-[#ECE4CE] p-3.5 rounded-2xl shadow-sm">
            <span class="text-xs font-bold uppercase tracking-wider text-ink flex items-center gap-2">
                <i class="fa-solid fa-sliders text-clay"></i> Filter &amp; Sort
            </span>
            <button id="toggle-filter-btn" type="button" class="bg-clay text-white text-xs font-semibold px-4 py-2 rounded-xl flex items-center gap-1.5 shadow-sm hover:bg-clay-dark transition">
                <i class="fa-solid fa-filter text-xs"></i> <span>Filter Options</span>
            </button>
        </div>

        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Sidebar Filters -->
            <aside id="filter-sidebar" class="hidden lg:block w-full lg:w-64 flex-shrink-0 bg-white p-6 rounded-2xl border border-[#ECE4CE] shadow-sm h-fit order-2 lg:order-1">
                <!-- YouTube Shimmer Skeleton for Filters -->
                <div id="filter-skeleton" class="space-y-6">
                    <div class="flex justify-between items-center pb-4 border-b border-dashed border-[#E3D9BC]">
                        <div class="skeleton-shimmer h-5 w-24 rounded"></div>
                        <div class="skeleton-shimmer h-4 w-12 rounded"></div>
                    </div>
                    <div>
                        <div class="skeleton-shimmer h-3 w-16 rounded mb-2.5"></div>
                        <div class="skeleton-shimmer h-9 w-full rounded-lg"></div>
                    </div>
                    <div>
                        <div class="skeleton-shimmer h-3 w-20 rounded mb-2.5"></div>
                        <div class="space-y-2.5">
                            <div class="skeleton-shimmer h-4 w-28 rounded"></div>
                            <div class="skeleton-shimmer h-4 w-28 rounded"></div>
                        </div>
                    </div>
                    <div>
                        <div class="skeleton-shimmer h-3 w-20 rounded mb-2.5"></div>
                        <div class="skeleton-shimmer h-2 w-full rounded mb-2"></div>
                        <div class="flex justify-between">
                            <div class="skeleton-shimmer h-3 w-8 rounded"></div>
                            <div class="skeleton-shimmer h-3 w-12 rounded"></div>
                        </div>
                    </div>
                    <div>
                        <div class="skeleton-shimmer h-3 w-28 rounded mb-2.5"></div>
                        <div class="space-y-2">
                            <div class="skeleton-shimmer h-4 w-36 rounded"></div>
                            <div class="skeleton-shimmer h-4 w-36 rounded"></div>
                        </div>
                    </div>
                </div>

                <!-- Actual Filter Content (Fades in smoothly when ready) -->
                <div id="filter-content" class="hidden">
                    <div class="flex items-center justify-between mb-6 border-b border-dashed border-[#E3D9BC] pb-4">
                        <h2 class="font-serif font-semibold text-ink tracking-wide text-base"><i class="fa-solid fa-sliders mr-2 text-clay text-sm"></i>Filters</h2>
                        <button onclick="resetFilters()" class="text-xs text-clay hover:text-clay-dark hover:underline font-semibold">Clear All</button>
                    </div>

                    <div class="mb-6">
                        <label class="block text-xs font-bold text-ash uppercase tracking-wider mb-2">Sort By</label>
                        <select id="sort-filter" onchange="filterProducts()" class="w-full bg-parchment border border-[#DCD3BA] rounded-lg p-2.5 text-sm text-ink focus:outline-none focus:border-clay">
                            <option value="featured">Featured</option>
                            <option value="price-low-high">Price: Low to High</option>
                            <option value="price-high-low">Price: High to Low</option>
                            <option value="rating-high-low">Top Rated</option>
                        </select>
                    </div>

                    <div class="mb-6">
                        <label class="block text-xs font-bold text-ash uppercase tracking-wider mb-2">Collection</label>
                        <div class="space-y-2.5">
                            <label class="flex items-center text-sm text-[#3d3b34] cursor-pointer hover:text-ink">
                                <input type="checkbox" name="category" value="face" onchange="filterProducts()" class="rounded border-[#DCD3BA] text-clay focus:ring-clay mr-2.5"> Face
                            </label>
                            <label class="flex items-center text-sm text-[#3d3b34] cursor-pointer hover:text-ink">
                                <input type="checkbox" name="category" value="body" onchange="filterProducts()" class="rounded border-[#DCD3BA] text-clay focus:ring-clay mr-2.5"> Body
                            </label>
                        </div>
                    </div>

                    <div class="mb-6">
                        <label class="block text-xs font-bold text-ash uppercase tracking-wider mb-2">Max Price</label>
                        <input type="range" id="price-range" min="200" max="2500" value="2500" oninput="updatePriceLabel(this.value)" onchange="filterProducts()" class="w-full h-1 bg-[#E3D9BC] rounded-lg appearance-none cursor-pointer accent-clay">
                        <div class="flex justify-between text-xs text-ash mt-2">
                            <span>₹200</span>
                            <span id="price-max-label" class="font-semibold text-clay">₹2500</span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-ash uppercase tracking-wider mb-2">Customer Review</label>
                        <div class="space-y-1.5">
                            <button onclick="setRatingFilter(4)" class="rating-filter-btn flex items-center text-sm text-[#3d3b34] hover:text-clay w-full text-left py-1">
                                <span class="text-gold mr-2 text-xs"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-regular fa-star text-[#D9D2BC]"></i></span> &amp; Up
                            </button>
                            <button onclick="setRatingFilter(3)" class="rating-filter-btn flex items-center text-sm text-[#3d3b34] hover:text-clay w-full text-left py-1">
                                <span class="text-gold mr-2 text-xs"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-regular fa-star text-[#D9D2BC]"></i><i class="fa-regular fa-star text-[#D9D2BC]"></i></span> &amp; Up
                            </button>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Product Grid Area (First on mobile via order-1) -->
            <section class="flex-1 order-1 lg:order-2">
                <div class="flex items-center justify-between mb-6 bg-white border border-[#ECE4CE] p-4 rounded-2xl shadow-sm">
                    <span id="results-count" class="text-sm font-medium text-ash">Showing all products</span>
                    <div class="flex gap-2 text-xs">
                        <span id="badge-bestseller" class="hidden bg-clay/10 text-clay-dark font-semibold px-3 py-1.5 rounded-full"><i class="fa-solid fa-fire mr-1"></i>Bestseller Filter Active</span>
                    </div>
                </div>

                <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                    <!-- YouTube-Style Shimmer Skeleton Loader 1 -->
                    <div class="bg-white rounded-2xl p-4 border border-[#ECE4CE] h-[470px] flex flex-col justify-between shadow-sm overflow-hidden">
                        <div class="skeleton-shimmer h-[170px] rounded-xl mb-4 w-full"></div>
                        <div class="skeleton-shimmer h-4 rounded w-3/4 mx-auto mb-2"></div>
                        <div class="skeleton-shimmer h-3 rounded w-5/6 mx-auto mb-4"></div>
                        <div class="flex justify-between items-center px-2 mb-3">
                            <div class="skeleton-shimmer h-6 w-16 rounded-full"></div>
                            <div class="skeleton-shimmer h-6 w-16 rounded-md"></div>
                        </div>
                        <div class="skeleton-shimmer h-8 rounded-lg w-full mb-3"></div>
                        <div class="skeleton-shimmer h-10 rounded-xl w-full mt-auto"></div>
                    </div>
                    <!-- YouTube-Style Shimmer Skeleton Loader 2 -->
                    <div class="bg-white rounded-2xl p-4 border border-[#ECE4CE] h-[470px] flex flex-col justify-between shadow-sm overflow-hidden hidden sm:flex">
                        <div class="skeleton-shimmer h-[170px] rounded-xl mb-4 w-full"></div>
                        <div class="skeleton-shimmer h-4 rounded w-3/4 mx-auto mb-2"></div>
                        <div class="skeleton-shimmer h-3 rounded w-5/6 mx-auto mb-4"></div>
                        <div class="flex justify-between items-center px-2 mb-3">
                            <div class="skeleton-shimmer h-6 w-16 rounded-full"></div>
                            <div class="skeleton-shimmer h-6 w-16 rounded-md"></div>
                        </div>
                        <div class="skeleton-shimmer h-8 rounded-lg w-full mb-3"></div>
                        <div class="skeleton-shimmer h-10 rounded-xl w-full mt-auto"></div>
                    </div>
                    <!-- YouTube-Style Shimmer Skeleton Loader 3 -->
                    <div class="bg-white rounded-2xl p-4 border border-[#ECE4CE] h-[470px] flex flex-col justify-between shadow-sm overflow-hidden hidden md:flex">
                        <div class="skeleton-shimmer h-[170px] rounded-xl mb-4 w-full"></div>
                        <div class="skeleton-shimmer h-4 rounded w-3/4 mx-auto mb-2"></div>
                        <div class="skeleton-shimmer h-3 rounded w-5/6 mx-auto mb-4"></div>
                        <div class="flex justify-between items-center px-2 mb-3">
                            <div class="skeleton-shimmer h-6 w-16 rounded-full"></div>
                            <div class="skeleton-shimmer h-6 w-16 rounded-md"></div>
                        </div>
                        <div class="skeleton-shimmer h-8 rounded-lg w-full mb-3"></div>
                        <div class="skeleton-shimmer h-10 rounded-xl w-full mt-auto"></div>
                    </div>
                </div>

                <div id="no-products" class="hidden text-center py-20 bg-white border border-[#ECE4CE] rounded-2xl mt-4">
                    <i class="fa-solid fa-magnifying-glass text-4xl text-[#D9D2BC] mb-3"></i>
                    <p class="text-ash font-medium">No items matched your filter selection.</p>
                </div>
            </section>
        </div>
    </main>

    <!-- FOOTER & MODALS -->
    <div id="footer-placeholder"></div>
    <div id="lead-modal-container"></div>

    <!-- CLEANED SCRIPTS (No Duplicate Imports) -->
    <script src="./js/include.js"></script>
    <script type="module" src="./js/navbar-interactions.js"></script>
    <script type="module" src="./js/lead.js"></script>
    <script type="module" src="./js/moreproduct.js"></script>

    <script>
        fetch('/lead.html')
            .then(response => response.text())
            .then(htmlContent => {
                document.getElementById('lead-modal-container').innerHTML = htmlContent;
            })
            .catch(err => console.error("Could not load lead modal:", err));
    </script>
</body>
</html>
