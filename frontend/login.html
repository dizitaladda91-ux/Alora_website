<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Alora Radiance</title>
  <link rel="icon" type="image/x-icon" href="./static/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Fraunces', 'Georgia', 'serif'],
            sans: ['Manrope', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="relative min-h-screen flex items-center justify-center overflow-hidden bg-[#FAF7F2] font-sans">

  <!-- Background: live index.html -->
  <iframe id="bgFrame" src="./index.html" class="fixed top-0 left-0 w-full h-full border-none scale-[1.02] pointer-events-none z-0" tabindex="-1" aria-hidden="true"></iframe>
  <div class="absolute inset-0 bg-black/40 backdrop-blur-xs z-[1] pointer-events-none"></div>

  <!-- Main Container for Forms -->
  <div class="bg-white/95 backdrop-blur-md p-6 sm:p-8 rounded-3xl shadow-2xl w-full max-w-md mx-4 relative z-10 border border-amber-900/10">
    <a href="./index.html" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-900 text-lg font-bold flex items-center justify-center transition-all no-underline" title="Close">&times;</a>

    <!-- LOGIN FORM -->
    <div id="loginSection">
      <div class="text-center mb-6">
        <h2 class="text-2xl sm:text-3xl font-serif font-bold text-slate-900 tracking-tight">Login to Alora</h2>
        <p class="text-xs text-slate-500 mt-1">Welcome back! Enter your credentials to access your account.</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-1 font-mono">Email Address</label>
          <input type="email" id="email" required placeholder="name@example.com" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:border-[#8B4513] focus:ring-2 focus:ring-amber-500/20 outline-none text-sm text-slate-900 bg-amber-50/20 transition-all">
        </div>
        <div>
          <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-1 font-mono">Password</label>
          <div class="relative">
            <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 pr-10 border border-slate-300 rounded-xl focus:border-[#8B4513] focus:ring-2 focus:ring-amber-500/20 outline-none text-sm text-slate-900 bg-amber-50/20 transition-all">
            <button type="button" onclick="togglePasswordVisibility('password', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-sm p-1.5 focus:outline-none" aria-label="Toggle password view">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
        <div class="text-right">
          <button type="button" id="showForgotBtn" onclick="toggleViews(true)" class="text-xs font-bold text-[#8B4513] hover:text-amber-900 transition-colors">Forgot Password?</button>
        </div>
        <button type="submit" class="w-full bg-[#8B4513] hover:bg-amber-900 text-white py-3.5 rounded-xl font-bold text-sm uppercase tracking-wider shadow-md transition-all active:scale-[0.99] cursor-pointer">Login</button>
      </form>
    </div>

    <!-- FORGOT PASSWORD FORM -->
    <div id="forgotSection" class="hidden">
      <div class="text-center mb-6">
        <h2 class="text-2xl sm:text-3xl font-serif font-bold text-slate-900 tracking-tight">Forgot Password</h2>
        <p class="text-xs text-slate-500 mt-1">Enter your account email to receive a password reset link.</p>
      </div>
      <form id="forgotForm" class="space-y-4">
        <div>
          <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-1 font-mono">Account Email</label>
          <input type="email" id="forgotEmail" required placeholder="Registered account email" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:border-[#8B4513] focus:ring-2 focus:ring-amber-500/20 outline-none text-sm text-slate-900 bg-amber-50/20 transition-all">
        </div>
        <div>
          <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-1 font-mono">Send Link To Email <span class="text-slate-400 font-normal lowercase">(optional)</span></label>
          <input type="email" id="deliveryEmail" placeholder="Alternative email for receiving reset link" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:border-[#8B4513] focus:ring-2 focus:ring-amber-500/20 outline-none text-sm text-slate-900 bg-amber-50/20 transition-all">
        </div>
        <button type="submit" class="w-full bg-[#8B4513] hover:bg-amber-900 text-white py-3.5 rounded-xl font-bold text-sm uppercase tracking-wider shadow-md transition-all active:scale-[0.99] cursor-pointer">Send Reset Link</button>
        <div class="text-center mt-4">
          <button type="button" id="backToLoginBtn" onclick="toggleViews(false)" class="text-xs font-bold text-slate-600 hover:text-slate-900 transition-colors">← Back to Login</button>
        </div>
      </form>
    </div>

    <p class="mt-6 text-center text-xs text-slate-600 font-medium">
      Don't have an account? <a href="register.html" class="text-[#8B4513] font-bold hover:underline ml-1">Register</a>
    </p>
  </div>

  <!-- Inline UI Switcher Script -->
  <script>
    function toggleViews(showForgot) {
      const loginSection = document.getElementById('loginSection');
      const forgotSection = document.getElementById('forgotSection');
      
      if (showForgot) {
        loginSection.classList.add('hidden');
        forgotSection.classList.remove('hidden');
      } else {
        forgotSection.classList.add('hidden');
        loginSection.classList.remove('hidden');
      }
    }
  </script>

  <script src="./js/include.js"></script>
  <script type="module" src="./js/auth.js"></script>
</body>
</html>
