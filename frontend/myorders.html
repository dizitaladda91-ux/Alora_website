<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - Alora Radiance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#FAF7EE] text-[#2A2A24] font-sans">
  <div id="navbar-placeholder"></div>
  <main class="max-w-5xl mx-auto px-4 py-10">
    <div class="mb-7">
      <p class="text-xs uppercase tracking-[0.2em] text-[#A0522D] font-bold">Account</p>
      <h1 class="text-3xl font-serif font-semibold mt-2">My Orders</h1>
      <p class="text-sm text-stone-600 mt-2">Track your payment and delivery status in one place.</p>
    </div>
    <div id="orders-loader" class="bg-white rounded-2xl border border-[#ECE4CE] p-8 text-center text-stone-500">Loading your orders...</div>
    <div id="orders-list" class="space-y-4"></div>
  </main>
  <div id="footer-placeholder"></div>
  <script src="./js/include.js"></script>
  <script type="module" src="./js/navbar-interactions.js"></script>
  <script type="module" src="./js/auth.js"></script>
  <script type="module" src="./js/myorders.js"></script>
</body>
</html>
