<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
    <h2 class="text-2xl font-bold mb-2 text-center text-gray-800 tracking-tight">Forgot Password</h2>
    <p class="text-xs text-gray-500 text-center mb-6">Enter your account email and target email to receive the reset link.</p>
    <form id="forgotForm" class="space-y-4">
      <div>
        <label class="block text-gray-600 text-sm font-medium">Account Email</label>
        <input type="email" id="forgotEmail" required placeholder="Account email to reset password" class="w-full mt-1 p-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-400 outline-none text-sm">
      </div>
      <div>
        <label class="block text-gray-600 text-sm font-medium">Send Link To Email <span class="text-xs text-gray-400">(Optional)</span></label>
        <input type="email" id="deliveryEmail" placeholder="Email where link should be sent (Default: Main Email)" class="w-full mt-1 p-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-400 outline-none text-sm">
      </div>
      <button type="submit" class="w-full bg-[#2A2A24] text-white py-2.5 rounded-xl font-semibold hover:bg-orange-600 transition shadow-sm cursor-pointer">Send Reset Link</button>
    </form>
  </div>
<script src="./js/include.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
