<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO ALORA | Edit Product</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="font-['Manrope'] bg-gray-50 min-h-screen">
    <nav class="h-16 bg-gray-900 text-white flex items-center px-6">
        <h1 class="text-xl font-bold text-indigo-400">SEO ALORA <span class="text-white text-sm font-normal ml-2">| Edit Product</span></h1>
    </nav>
    <main class="max-w-3xl mx-auto p-6 sm:p-8">
        <a href="./seoproduct.html" class="text-sm font-semibold text-indigo-600"><i class="fa-solid fa-arrow-left mr-1"></i> Back to products</a>
        <form id="seo-product-form" class="bg-white mt-5 p-6 sm:p-8 rounded-xl border border-gray-200 shadow-sm space-y-6">
            <div>
                <p class="text-xs font-bold uppercase tracking-wider text-gray-400">Product</p>
                <h2 id="product-name" class="text-2xl font-bold text-gray-900 mt-1">Loading...</h2>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Main Product Image</label>
                <img id="image-preview" class="hidden h-32 w-32 rounded-xl object-cover border mb-3">
                <input type="file" name="imagepath" accept="image/*" class="block w-full text-sm">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Gallery Images (up to 6)</label>
                <input type="file" name="galleryImages" accept="image/*" multiple class="block w-full text-sm rounded-lg border border-gray-300 p-2.5">
                <p class="mt-1 text-xs text-gray-500">Selecting new gallery images will replace existing gallery.</p>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Description</label>
                <textarea name="description" required rows="5" class="w-full rounded-lg border border-gray-300 p-3 text-sm"></textarea>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Rating</label>
                <input name="rating" type="number" required min="0" max="5" step="0.1" class="w-full rounded-lg border border-gray-300 p-3 text-sm">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">ML / volume measurements</label>
                <div id="volumes" class="space-y-3"></div>
                <p class="mt-2 text-xs text-gray-500">Prices and stock are controlled by the admin and cannot be changed here.</p>
            </div>
            <div class="pt-2 flex gap-3">
                <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-lg" type="submit">Save allowed changes</button>
                <a href="./seoproduct.html" class="px-5 py-2.5 font-bold text-gray-600">Cancel</a>
            </div>
        </form>
    </main>
    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/seoproductupdate.js"></script>
</body>
</html>
