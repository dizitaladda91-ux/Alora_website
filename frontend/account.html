<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account &amp; Order History | Alora Radiance</title>
    <link rel="icon" type="image/x-icon" href="./static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    ink: '#152219',
                    'ink-light': '#1F3327',
                    parchment: '#F7F2E7',
                    clay: '#A24C3D',
                    'clay-dark': '#7E3A2F',
                    sage: '#6C8763',
                    gold: '#BB9556',
                    ash: '#6B685F',
                },
                fontFamily: {
                    serif: ['"Fraunces"', 'Georgia', 'serif'],
                    sans: ['"Manrope"', 'sans-serif'],
                }
            }
        }
    }
    </script>
</head>
<body class="bg-parchment text-[#2A2A24] font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header Navigation -->
    <div id="navbar-placeholder"></div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full space-y-8">
        
        <!-- Account Greeting Header -->
        <div class="bg-white rounded-3xl p-6 sm:p-8 border border-[#ECE4CE] shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 rounded-2xl bg-ink text-gold flex items-center justify-center text-2xl font-serif font-bold shadow-md">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <h1 id="user-greeting" class="text-2xl sm:text-3xl font-serif font-bold text-ink">Welcome Back</h1>
                    <p id="user-email" class="text-sm text-ash mt-0.5">Loading profile...</p>
                </div>
            </div>
            <div class="flex gap-3 w-full md:w-auto">
                <a href="/track-order" class="flex-1 md:flex-none text-center bg-parchment hover:bg-[#EAE2D0] text-ink font-semibold text-xs px-5 py-3 rounded-xl border border-[#DCD3BA] transition inline-flex items-center justify-center gap-2">
                    <i class="fa-solid fa-truck-fast text-clay"></i> Track Order
                </a>
                <button id="logout-btn" type="button" class="flex-1 md:flex-none bg-red-50 hover:bg-red-100 text-red-600 font-semibold text-xs px-5 py-3 rounded-xl border border-red-200 transition inline-flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>

        <!-- Order History Section -->
        <div class="space-y-6">
            <div class="flex justify-between items-center border-b border-[#E3DAC6] pb-4">
                <div>
                    <h2 class="text-xl sm:text-2xl font-serif font-bold text-ink">Order History</h2>
                    <p class="text-xs text-ash mt-1">View your past purchases, shipment statuses, and receipts</p>
                </div>
                <span id="order-count-badge" class="bg-ink text-parchment text-xs font-bold px-3 py-1 rounded-full">0 Orders</span>
            </div>

            <!-- Orders Container -->
            <div id="orders-container" class="space-y-6">
                <!-- Skeleton Loader -->
                <div class="animate-pulse bg-white p-6 rounded-2xl border border-[#ECE4CE] space-y-4">
                    <div class="h-5 bg-gray-200 rounded w-1/3"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/2"></div>
                    <div class="h-20 bg-gray-100 rounded"></div>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="./js/include.js"></script>
    <script type="module" src="./js/account.js"></script>
</body>
</html>
